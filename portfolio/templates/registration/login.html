{% load static %}
{% load i18n %}

<!DOCTYPE html>

<html lang="{{ LANGUAGE_CODE }}">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% trans "Connexion" %}
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                linear-gradient(
                    135deg,
                    #0f172a,
                    #1e293b
                );
            font-family: Arial, sans-serif;
        }

        .login-card {

            width: 100%;
            max-width: 420px;

            padding: 40px;

            background: white;

            border-radius: 20px;

            box-shadow:
                0 20px 50px
                rgba(0,0,0,.25);

        }

        .logo {

            text-align: center;

            font-size: 32px;

            font-weight: 800;

            margin-bottom: 10px;

        }

        .logo span {
            color: #2563eb;
        }

        .subtitle {

            text-align: center;

            color: #64748b;

            margin-bottom: 30px;

        }

        .form-control {

            height: 50px;

            border-radius: 10px;

        }

        .btn-login {

            width: 100%;

            height: 50px;

            border: none;

            border-radius: 10px;

            background: #2563eb;

            color: white;

            font-weight: 600;

        }

        .btn-login:hover {

            background: #1d4ed8;

        }

        .language {

            text-align: center;

            margin-top: 20px;

        }

    </style>

</head>


<body>


<div class="login-card">


    <div class="logo">

        DJIM<span>.</span>

    </div>


    <p class="subtitle">

        {% trans "Administration du portfolio" %}

    </p>


    {% if error %}

        <div class="alert alert-danger">

            {{ error }}

        </div>

    {% endif %}


    <form
        method="post"
    >

        {% csrf_token %}


        <div class="mb-3">

            <label class="form-label">

                {% trans "Nom d'utilisateur" %}

            </label>

            <input
                type="text"
                name="username"
                class="form-control"
                placeholder="{% trans 'Votre nom d’utilisateur' %}"
                required
                autofocus
            >

        </div>


        <div class="mb-3">

            <label class="form-label">

                {% trans "Mot de passe" %}

            </label>

            <input
                type="password"
                name="password"
                class="form-control"
                placeholder="{% trans 'Votre mot de passe' %}"
                required
            >

        </div>


        <button
            type="submit"
            class="btn-login"
        >

            {% trans "Se connecter" %}

        </button>


    </form>


    <div class="language">

        <form
            action="{% url 'set_language' %}"
            method="post"
        >

            {% csrf_token %}

            <input
                type="hidden"
                name="next"
                value="{{ request.get_full_path }}"
            >

            <button
                type="submit"
                name="language"
                value="fr"
                class="btn btn-sm btn-outline-secondary"
            >
                FR
            </button>

            <button
                type="submit"
                name="language"
                value="en"
                class="btn btn-sm btn-outline-secondary"
            >
                EN
            </button>

        </form>

    </div>


</div>


</body>

</html>
